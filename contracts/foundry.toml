[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ignored_error_codes = [6275]                           # Ignore "Source not found" errors
exclude_paths = ["lib/openzeppelin-contracts/certora"]
# Enable via-ir to fix stack too deep errors
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
